name: Discord audit window

on:
  schedule:
    # Use Pacific time directly so daylight-saving changes do not shift the bot's schedule.
    - cron: "30 7 * * *"
      timezone: "America/Los_Angeles"
    - cron: "45 16 * * *"
      timezone: "America/Los_Angeles"
    # Avoid the busy start of the hour, when GitHub may delay scheduled workflows.
    - cron: "5 20 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run bot for 30 minutes
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_MEETING_DATABASE_ID: ${{ secrets.NOTION_MEETING_DATABASE_ID }}
          NOTION_MEMBERS_DATABASE_ID: ${{ secrets.NOTION_MEMBERS_DATABASE_ID }}
        run: |
          set +e
          timeout 30m python main.py
          exit_code=$?
          if [ "$exit_code" -eq 124 ]; then exit 0; fi
          exit "$exit_code"
