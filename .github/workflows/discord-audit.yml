name: Discord audit window

on:
  schedule:
    # 7:30 AM Pacific → 2:30 PM UTC
    - cron: "30 14 * * *"

    # 4:45 PM Pacific → 11:45 PM UTC
    - cron: "45 23 * * *"

    # 8:05 PM Pacific → 3:05 AM UTC the next day
    - cron: "5 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run bot for 30 minutes
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_MEETING_DATABASE_ID: ${{ secrets.NOTION_MEETING_DATABASE_ID }}
          NOTION_MEMBERS_DATABASE_ID: ${{ secrets.NOTION_MEMBERS_DATABASE_ID }}
        run: |
          set +e
          timeout 130m python main.py
          exit_code=$?
          if [ "$exit_code" -eq 124 ]; then exit 0; fi
          exit "$exit_code"
